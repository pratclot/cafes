<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="A photo log of the cafes you visit." />
    <title>Cafes · little places, big memories</title>
    <style>
      html, body { margin: 0; min-width: 320px; height: 100vh; height: 100dvh; overflow: hidden; background: #fff8f0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #ComposeTarget { width: 100%; height: 100vh; height: 100dvh; }
      #CameraPreview {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        object-fit: cover;
        border-radius: 18px;
        z-index: 5;
        display: none;
        pointer-events: none;
        background: #1c1815;
      }
      #LoadingScreen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #3e342c;
        background: #fff8f0;
      }
      #LoadingScreen[hidden] { display: none; }
      .loading-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #eadfd3;
        border-top-color: #8d5e3c;
        border-radius: 50%;
        animation: cafe-spin 0.85s linear infinite;
      }
      .loading-title { margin: 0; font-size: 1.15rem; font-weight: 650; }
      .loading-detail { margin: -12px 0 0; color: #786b60; font-size: 0.9rem; }
      @keyframes cafe-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="LoadingScreen" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-title">Cafe moments</p>
      <p class="loading-detail">Getting your cafe log ready…</p>
    </div>
    <div id="ComposeTarget" aria-busy="true"></div>
    <video id="CameraPreview" autoplay playsinline muted></video>
    <script>
      (() => {
        const transformersVersion = '3.3.3';
        const modelId = 'Xenova/siglip-base-patch16-224';
        const baseUrl = new URL('.', window.location.href).href;
        let classifierPromise = null;

        async function loadTransformersModule() {
          const urls = [
            `https://cdn.jsdelivr.net/npm/@huggingface/transformers@${transformersVersion}/dist/transformers.min.js`,
            `https://cdn.jsdelivr.net/npm/@huggingface/transformers@${transformersVersion}/+esm`,
          ];
          let lastError = null;
          for (const url of urls) {
            try {
              const mod = await import(url);
              const resolved = mod?.SiglipVisionModel ? mod : mod?.default;
              if (resolved?.SiglipVisionModel && resolved?.Tensor) return resolved;
            } catch (err) {
              lastError = err;
            }
          }
          throw lastError || new Error('Transformers.js runtime could not be loaded.');
        }

        function decodeBase64Int16(base64) {
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new Int16Array(bytes.buffer);
        }

        function getFoodClassifier() {
          if (!classifierPromise) {
            classifierPromise = (async () => {
              const [transformers, embResponse] = await Promise.all([
                loadTransformersModule(),
                fetch(new URL('food_siglip_embeddings.json', baseUrl)),
              ]);
              if (!embResponse.ok) {
                throw new Error(`food_siglip_embeddings.json HTTP ${embResponse.status}`);
              }
              const payload = await embResponse.json();
              const embeddingsInt16 = decodeBase64Int16(payload.embeddingsBase64);
              const visionModel = await transformers.SiglipVisionModel.from_pretrained(modelId, {
                dtype: 'q8',
              });
              return { Tensor: transformers.Tensor, visionModel, payload, embeddingsInt16 };
            })().catch(err => {
              classifierPromise = null;
              throw err;
            });
          }
          return classifierPromise;
        }

        async function computeImageViewsEmbeddings(image, Tensor, visionModel, dim) {
          const w = image.naturalWidth || image.width;
          const h = image.naturalHeight || image.height;
          const side = Math.min(w, h);
          const cx = Math.max(0, Math.floor((w - side) / 2));
          const cy = Math.max(0, Math.floor((h - side) / 2));

          const boxes = [[cx, cy, side, side]];
          const region = Math.max(1, Math.floor(side * 0.75));
          const rx0 = Math.max(0, Math.floor((w - region) / 2));
          const ry0 = Math.max(0, Math.floor((h - region) / 2));
          const psize = Math.max(1, Math.floor(region * 0.45));
          const step = Math.floor((region - psize) / 2);
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              boxes.push([rx0 + c * step, ry0 + r * step, psize, psize]);
            }
          }

          const nViews = boxes.length;
          const plane = 224 * 224;
          const pixelValues = new Float32Array(3 * plane);
          const normViews = new Float32Array(nViews * dim);
          const canvas = document.createElement('canvas');
          canvas.width = 224;
          canvas.height = 224;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          for (let v = 0; v < nViews; v++) {
            const [sx, sy, sw, sh] = boxes[v];
            ctx.clearRect(0, 0, 224, 224);
            ctx.drawImage(image, sx, sy, sw, sh, 0, 0, 224, 224);
            const rgba = ctx.getImageData(0, 0, 224, 224).data;
            for (let i = 0; i < plane; i++) {
              const p = i * 4;
              pixelValues[i] = rgba[p] / 127.5 - 1.0;
              pixelValues[plane + i] = rgba[p + 1] / 127.5 - 1.0;
              pixelValues[2 * plane + i] = rgba[p + 2] / 127.5 - 1.0;
            }
            await new Promise(resolve => setTimeout(resolve, 0));
            const visOut = await visionModel({ pixel_values: new Tensor('float32', pixelValues, [1, 3, 224, 224]) });
            const pooler = visOut.pooler_output.data;
            let norm = 0;
            for (let i = 0; i < dim; i++) norm += pooler[i] * pooler[i];
            norm = Math.sqrt(norm) || 1;
            const off = v * dim;
            for (let i = 0; i < dim; i++) normViews[off + i] = pooler[i] / norm;
          }

          return { normViews, nViews };
        }

        window.cafeClassifyPhotos = async photos => {
          const { Tensor, visionModel, payload, embeddingsInt16 } = await getFoodClassifier();
          const dim = payload.dim || 768;
          const scale = payload.int16Scale;
          const bestDishScores = new Map();
          const bestIngScores = new Map();

          for (const source of photos) {
            if (!source) continue;
            const image = new Image();
            image.src = source;
            await image.decode();

            const { normViews, nViews } = await computeImageViewsEmbeddings(image, Tensor, visionModel, dim);

            const dotPrompt = (viewIdx, promptIdx) => {
              let s = 0;
              const vOff = viewIdx * dim;
              const pOff = promptIdx * dim;
              for (let i = 0; i < dim; i++) {
                s += normViews[vOff + i] * (embeddingsInt16[pOff + i] * scale);
              }
              return s;
            };

            let pIdx = 0;
            for (const dish of payload.dishes) {
              let bestLogit = -Infinity;
              for (let c = 0; c < dish.count; c++) {
                const logit = dotPrompt(0, pIdx++) + payload.dishBias;
                if (logit > bestLogit) bestLogit = logit;
              }
              const score = 1 / (1 + Math.exp(-bestLogit));
              if (!bestDishScores.has(dish.name) || bestDishScores.get(dish.name) < score) {
                bestDishScores.set(dish.name, score);
              }
            }

            for (const ing of payload.ingredients) {
              let bestLogit = -Infinity;
              for (let c = 0; c < ing.count; c++) {
                for (let v = 1; v < nViews; v++) {
                  const logit = dotPrompt(v, pIdx) + payload.ingredientBias;
                  if (logit > bestLogit) bestLogit = logit;
                }
                pIdx++;
              }
              const score = 1 / (1 + Math.exp(-bestLogit));
              if (!bestIngScores.has(ing.name) || bestIngScores.get(ing.name) < score) {
                bestIngScores.set(ing.name, score);
              }
            }
          }

          const topDishes = [...bestDishScores.entries()]
            .filter(([, score]) => score >= 0.12)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3);
          const topIngredients = [...bestIngScores.entries()]
            .filter(([, score]) => score >= 0.12)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5);

          return [...topDishes, ...topIngredients]
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6)
            .map(([name, score]) => `${encodeURIComponent(name)}|${score}`)
            .join('\n');
        };

        window.cafeFoodClassifierReady = getFoodClassifier();
        window.cafeFoodClassifierReady.catch(() => {});
      })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
  </body>
</html>
