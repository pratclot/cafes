<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="A photo log of the cafes you visit." />
    <title>Cafes · little places, big memories</title>
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #fff8f0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #ComposeTarget { min-height: 100vh; }
      #LoadingScreen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #3e342c;
        background: #fff8f0;
      }
      #LoadingScreen[hidden] { display: none; }
      .loading-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #eadfd3;
        border-top-color: #8d5e3c;
        border-radius: 50%;
        animation: cafe-spin 0.85s linear infinite;
      }
      .loading-title { margin: 0; font-size: 1.15rem; font-weight: 650; }
      .loading-detail { margin: -12px 0 0; color: #786b60; font-size: 0.9rem; }
      @keyframes cafe-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="LoadingScreen" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-title">Cafe moments</p>
      <p class="loading-detail">Getting your cafe log ready…</p>
    </div>
    <div id="ComposeTarget" aria-busy="true"></div>
    <script type="module">
      const version = '0.10.20';
      const runtime = import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${version}/+esm`);
      window.cafeFoodClassifierReady = Promise.all([
        runtime,
        fetch('food_labels.csv').then(response => response.text()),
      ]).then(async ([vision, csv]) => {
        const files = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${version}/wasm`);
        const classifier = await vision.ImageClassifier.createFromOptions(files, {
          baseOptions: { modelAssetPath: 'food_v1.tflite' },
          runningMode: 'IMAGE', maxResults: 5, scoreThreshold: 0.12,
        });
        const labels = new Map(csv.trim().split(/\r?\n/).slice(1).map(row => {
          const [id, ...name] = row.split(','); return [Number(id), name.join(',')];
        }));
        window.cafeClassifyPhotos = async photos => {
          const result = new Map();
          for (const source of photos) {
            const image = new Image(); image.src = source;
            await image.decode();
            const categories = classifier.classify(image).classifications[0]?.categories || [];
            for (const category of categories) {
              const name = labels.get(category.index);
              if (name && category.index > 0 && (!result.has(name) || result.get(name) < category.score)) result.set(name, category.score);
            }
          }
          return [...result].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([name, score]) => `${encodeURIComponent(name)}|${score}`).join('\n');
        };
      });
    </script>
    <script type="application/javascript" src="webApp.js"></script>
  </body>
</html>
