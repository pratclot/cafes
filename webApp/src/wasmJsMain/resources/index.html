<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="A photo log of the cafes you visit." />
    <title>Cafes · little places, big memories</title>
    <style>
      html, body { margin: 0; min-width: 320px; height: 100vh; height: 100dvh; overflow: hidden; background: #fff8f0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #ComposeTarget { width: 100%; height: 100vh; height: 100dvh; }
      #CameraPreview {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        object-fit: cover;
        border-radius: 18px;
        z-index: 5;
        display: none;
        pointer-events: none;
        background: #1c1815;
      }
      #LoadingScreen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #3e342c;
        background: #fff8f0;
      }
      #LoadingScreen[hidden] { display: none; }
      .loading-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #eadfd3;
        border-top-color: #8d5e3c;
        border-radius: 50%;
        animation: cafe-spin 0.85s linear infinite;
      }
      .loading-title { margin: 0; font-size: 1.15rem; font-weight: 650; }
      .loading-detail { margin: -12px 0 0; color: #786b60; font-size: 0.9rem; }
      @keyframes cafe-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="LoadingScreen" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-title">Cafe moments</p>
      <p class="loading-detail">Getting your cafe log ready…</p>
    </div>
    <div id="ComposeTarget" aria-busy="true"></div>
    <video id="CameraPreview" autoplay playsinline muted></video>
    <script>
      (() => {
        const baseUrl = new URL('.', window.location.href).href;
        let worker = null;
        let nextMessageId = 1;
        const pendingRequests = new Map();

        function ensureWorker() {
          if (!worker) {
            worker = new Worker(new URL('food-classifier-worker.js', baseUrl), { type: 'module' });
            worker.onmessage = event => {
              const msg = event.data || {};
              const pending = pendingRequests.get(msg.id);
              if (!pending) return;
              pendingRequests.delete(msg.id);
              if (msg.ok) {
                pending.resolve(msg.output ?? '');
              } else {
                pending.reject(new Error(msg.error || 'Worker classification failed.'));
              }
            };
            worker.onerror = err => {
              const error = new Error(err?.message || 'Food classifier worker crashed.');
              for (const pending of pendingRequests.values()) {
                pending.reject(error);
              }
              pendingRequests.clear();
              worker = null;
            };
          }
          return worker;
        }

        function postToWorker(payload, transfer = []) {
          const w = ensureWorker();
          const id = nextMessageId++;
          return new Promise((resolve, reject) => {
            pendingRequests.set(id, { resolve, reject });
            w.postMessage({ ...payload, id, baseUrl }, transfer);
          });
        }

        function extractImageViews(image) {
          const w = image.naturalWidth || image.width;
          const h = image.naturalHeight || image.height;
          const side = Math.min(w, h);
          const cx = Math.max(0, Math.floor((w - side) / 2));
          const cy = Math.max(0, Math.floor((h - side) / 2));

          const boxes = [[cx, cy, side, side]];
          const region = Math.max(1, Math.floor(side * 0.75));
          const rx0 = Math.max(0, Math.floor((w - region) / 2));
          const ry0 = Math.max(0, Math.floor((h - region) / 2));
          const psize = Math.max(1, Math.floor(region * 0.45));
          const step = Math.floor((region - psize) / 2);
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              boxes.push([rx0 + c * step, ry0 + r * step, psize, psize]);
            }
          }

          const nViews = boxes.length;
          const plane = 224 * 224;
          const viewStride = 3 * plane;
          const allPixels = new Float32Array(nViews * viewStride);
          const canvas = document.createElement('canvas');
          canvas.width = 224;
          canvas.height = 224;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          for (let v = 0; v < nViews; v++) {
            const [sx, sy, sw, sh] = boxes[v];
            ctx.clearRect(0, 0, 224, 224);
            ctx.drawImage(image, sx, sy, sw, sh, 0, 0, 224, 224);
            const rgba = ctx.getImageData(0, 0, 224, 224).data;
            const baseOff = v * viewStride;
            for (let i = 0; i < plane; i++) {
              const p = i * 4;
              allPixels[baseOff + i] = rgba[p] / 127.5 - 1.0;
              allPixels[baseOff + plane + i] = rgba[p + 1] / 127.5 - 1.0;
              allPixels[baseOff + 2 * plane + i] = rgba[p + 2] / 127.5 - 1.0;
            }
          }

          return { nViews, buffer: allPixels.buffer };
        }

        window.cafeClassifyPhotos = async photos => {
          const photoViews = [];
          const transferBuffers = [];

          for (const source of photos) {
            if (!source) continue;
            const image = new Image();
            image.src = source;
            await image.decode();
            const extracted = extractImageViews(image);
            photoViews.push(extracted);
            transferBuffers.push(extracted.buffer);
            await new Promise(resolve => setTimeout(resolve, 0));
          }

          if (photoViews.length === 0) return '';
          return await postToWorker({ type: 'classify', photoViews }, transferBuffers);
        };

        window.cafeFoodClassifierReady = postToWorker({ type: 'init' });
        window.cafeFoodClassifierReady.catch(() => {});
      })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
  </body>
</html>
