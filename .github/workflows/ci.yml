name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis and tests
        run: ./gradlew ktlintCheck detekt :app:lintDebug :core:data:testAndroidHostTest :feature:cafe-log:testDebugUnitTest :app:assembleDebug :webApp:wasmJsBrowserDistribution
